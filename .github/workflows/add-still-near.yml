name: Add Still Near to links page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert Still Near entry and update count
        run: |
          python3 - <<'PYEOF'
          def article(src):
              return (
                  "      <article class=\"book\">\n"
                  "        <img src=\"" + src + "\" alt=\"Cover of \u201cStill Near\u201d\" width=\"104\" height=\"156\" />\n"
                  "        <div class=\"info\">\n"
                  "          <h3>Still Near</h3>\n"
                  "          <p class=\"kick\">A comfort book for the ones who stayed, and the quiet ways love keeps its seat at the table</p>\n"
                  "          <p class=\"desc\">His chair still at the table. Her song in the wrong grocery store. A dream so ordinary it felt like a visit. Still Near is a gentle field guide to noticing those moments, writing them down, and weighing them honestly -- without ever being told what you must believe. Ten chapters, a 30-day gentle journal, and 50 prompts for the ones who stayed.</p>\n"
                  "          <div class=\"buyrow\">\n"
                  "            <span>\n"
                  "              <span class=\"price\">$17</span>\n"
                  "              <span class=\"meta\">57 pages - book + workbook</span>\n"
                  "            </span>\n"
                  "            <a class=\"getbook\" href=\"https://payhip.com/b/qdBz9\">Get the book</a>\n"
                  "          </div>\n"
                  "        </div>\n"
                  "      </article>"
              )

          MARKER = "FGQk6\">Get the book</a>\n          </div>\n        </div>\n      </article>"
          COUNT_OLD = "All seven are live now on Payhip"
          COUNT_NEW = "All eight are live now on Payhip"

          for path, src in (("index.html", "cover-still-near.png"),
                            ("links/index.html", "../cover-still-near.png")):
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              if "Still Near" in content:
                  print(path + ": already updated, skipping")
                  continue
              assert content.count(COUNT_OLD) == 1, path
              assert content.count(MARKER) == 1, path
              content = content.replace(COUNT_OLD, COUNT_NEW)
              content = content.replace(MARKER, MARKER + "\n\n" + article(src))
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(path + ": updated")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "SpiritClick"
          git config user.email "SpiritClick@users.noreply.github.com"
          git add index.html links/index.html
          git diff --cached --quiet || git commit -m "Add Still Near to links page"
          git push
